name: ABK Style ApkeSU GKI Build

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: true
        type: string
      feature_set:
        required: true
        type: string
      use_repo:
        required: true
        type: boolean
      use_latest_susfs:
        required: true
        type: boolean
      build_bypass:
        required: true
        type: boolean
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: false
        type: boolean
        default: false
      zram_full_algo:
        required: false
        type: boolean
        default: false
      zram_extra_algos:
        required: false
        type: string
        default: ""
      use_ntsync:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      virtualization_support:
        required: false
        type: string
        default: "off"
      use_bbg:
        required: false
        type: boolean
        default: false
      use_ddk:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      supp_op:
        required: false
        type: boolean
        default: false
      use_custom_external_modules:
        required: false
        type: boolean
        default: false
      custom_external_modules:
        required: false
        type: string
        default: ""
      upload_aux_artifacts:
        required: false
        type: boolean
        default: true
      oplus_patch_mode:
        required: false
        type: string
        default: "off"
      oplus_reference_ref:
        required: false
        type: string
        default: "main"

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.feature_set }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Build information summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       ABK-style ApkeSU GKI build"
          echo "========================================"
          echo "Android version : ${{ inputs.android_version }}"
          echo "Kernel version  : ${{ inputs.kernel_version }}"
          echo "Sublevel        : ${{ inputs.sublevel }}"
          echo "Patch level     : ${{ inputs.os_patch_level }}"
          echo "Variant         : ${{ inputs.variant }}"
          echo "Feature set     : ${{ inputs.feature_set }}"
          echo "Build time      : ${{ inputs.build_time }}"
          echo "SUSFS latest    : ${{ inputs.use_latest_susfs }}"
          echo "ZRAM            : ${{ inputs.use_zram }}"
          echo "ZRAM full algo  : ${{ inputs.zram_full_algo }}"
          echo "ZRAM extra      : ${{ inputs.zram_extra_algos || 'none' }}"
          echo "NTsync          : ${{ inputs.use_ntsync }}"
          echo "Networking      : ${{ inputs.use_networking }}"
          echo "Virtualization  : ${{ inputs.virtualization_support }}"
          echo "OPlus mode      : ${{ inputs.oplus_patch_mode }}"
          echo "Bypass image    : ${{ inputs.build_bypass }}"
          echo "========================================"

          {
            echo "### ABK-style ApkeSU GKI build"
            echo
            echo "- Target: \`${{ inputs.version }}.${{ inputs.sublevel }}-${{ inputs.os_patch_level }}\`"
            echo "- Variant: \`${{ inputs.variant }}\`"
            echo "- Feature set: \`${{ inputs.feature_set }}\`"
            echo "- ZRAM: \`${{ inputs.use_zram }}\`"
            echo "- NTsync: \`${{ inputs.use_ntsync }}\`"
            echo "- Networking: \`${{ inputs.use_networking }}\`"
            echo "- Virtualization: \`${{ inputs.virtualization_support }}\`"
            echo "- Bypass image: \`${{ inputs.build_bypass }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate ABK feature switches for ApkeSU
        shell: bash
        run: |
          set -euo pipefail

          unsupported=()
          [ "${{ inputs.use_bbg }}" = "true" ] && unsupported+=("BBG")
          [ "${{ inputs.use_ddk }}" = "true" ] && unsupported+=("DDK LSM")
          [ "${{ inputs.use_kpm }}" = "true" ] && unsupported+=("KPM")
          [ "${{ inputs.use_rekernel }}" = "true" ] && unsupported+=("Re-Kernel")
          [ "${{ inputs.supp_op }}" = "true" ] && unsupported+=("supp_op")
          [ "${{ inputs.use_custom_external_modules }}" = "true" ] && unsupported+=("custom external modules")

          case "${{ inputs.feature_set }}" in
            ApkeSU|ApkeSU+SUSFS) ;;
            *)
              echo "::error::Unsupported ApkeSU feature_set: ${{ inputs.feature_set }}"
              exit 1
              ;;
          esac

          case "${{ inputs.oplus_patch_mode }}" in
            off|compat|zram) ;;
            *)
              echo "::error::Unsupported OPlus patch mode: ${{ inputs.oplus_patch_mode }}"
              exit 1
              ;;
          esac

          if [ "${#unsupported[@]}" -gt 0 ]; then
            printf '::error::These ABK switches need ABK-only patch sources and are not wired for ApkeSU yet: %s\n' "${unsupported[*]}"
            printf '::error::Keep them disabled, or add ApkeSU-native implementations before enabling them.\n'
            exit 1
          fi

          if [ -n "${{ inputs.custom_external_modules }}" ]; then
            echo "::warning::custom_external_modules is ignored unless use_custom_external_modules is implemented."
          fi

      - name: Checkout ApkeSU
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 16

      - name: Setup build environment
        uses: ./.github/actions/gki-setup-build-environment

      - name: Download GKI source
        uses: ./.github/actions/gki-download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          use_repo: ${{ inputs.use_repo }}

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME="${{ inputs.build_time }}"
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"

          if [ -z "$BUILD_TIME" ] || [ "$BUILD_TIME" = "N" ]; then
            SOURCE_DATE_EPOCH="$(date -u +%s)"
          else
            SOURCE_DATE_EPOCH="$(date -u -d "$BUILD_TIME" +%s)"
          fi

          if [ -z "${SOURCE_DATE_EPOCH:-}" ]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            else
              OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
            fi
            SOURCE_DATE_EPOCH="$(date -u -d "${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC" +%s)"
          fi

          KBUILD_TS="$(date -u -d "@${SOURCE_DATE_EPOCH}" '+%a %b %d %H:%M:%S UTC %Y')"
          GIT_DATE="$(date -u -d "@${SOURCE_DATE_EPOCH}" '+%Y-%m-%dT%H:%M:%SZ')"

          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_TS" >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_DATE=$GIT_DATE" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_DATE=$GIT_DATE" >> "$GITHUB_ENV"

      - name: Extract sublevel and file name
        id: extract
        uses: ./.github/actions/gki-extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}

      - name: Kernel fixes
        uses: ./.github/actions/gki-kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Setup ApkeSU
        uses: ./.github/actions/gki-apkesu
        with:
          enable_susfs: ${{ contains(inputs.feature_set, 'SUSFS') }}

      - name: Setup SUSFS
        if: ${{ contains(inputs.feature_set, 'SUSFS') }}
        uses: ./.github/actions/gki-susfs
        with:
          use_latest_commits: ${{ inputs.use_latest_susfs }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply ApkeSU post patch fixes
        uses: ./.github/actions/gki-apkesu-post-fixes

      - name: Apply ABK-style risky configs
        shell: bash
        working-directory: ${{ github.workspace }}/.gki/kernel/common
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "gki_defconfig not found: $DEFCONFIG" >&2
            exit 1
          fi

          append_config() {
            local line="$1"
            local key="${line%%=*}"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$line|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$line|g" "$DEFCONFIG"
            else
              echo "$line" >> "$DEFCONFIG"
            fi
          }

          if [ "${{ inputs.use_zram }}" = "true" ]; then
            append_config "CONFIG_ZRAM=y"
            append_config "CONFIG_ZSMALLOC=y"
            append_config "CONFIG_ZSMALLOC_STAT=y"
            append_config "CONFIG_CRYPTO_LZ4=y"
            append_config "CONFIG_CRYPTO_LZ4HC=y"
            append_config "CONFIG_CRYPTO_ZSTD=y"
          fi

          if [ "${{ inputs.zram_full_algo }}" = "true" ]; then
            append_config "CONFIG_CRYPTO_LZO=y"
            append_config "CONFIG_CRYPTO_LZ4=y"
            append_config "CONFIG_CRYPTO_LZ4HC=y"
            append_config "CONFIG_CRYPTO_842=y"
            append_config "CONFIG_CRYPTO_DEFLATE=y"
            append_config "CONFIG_CRYPTO_ZSTD=y"
          fi

          IFS=',' read -r -a algos <<< "${{ inputs.zram_extra_algos }}"
          for raw_algo in "${algos[@]}"; do
            algo="$(echo "$raw_algo" | xargs | tr '[:upper:]' '[:lower:]')"
            [ -z "$algo" ] && continue
            case "$algo" in
              lzo) append_config "CONFIG_CRYPTO_LZO=y" ;;
              lz4) append_config "CONFIG_CRYPTO_LZ4=y" ;;
              lz4hc) append_config "CONFIG_CRYPTO_LZ4HC=y" ;;
              842) append_config "CONFIG_CRYPTO_842=y" ;;
              deflate) append_config "CONFIG_CRYPTO_DEFLATE=y" ;;
              zstd|zstdn|zstdp) append_config "CONFIG_CRYPTO_ZSTD=y" ;;
              lz4k|lz4kd|lz4k_oplus)
                echo "::warning::$algo needs ABK/OPlus legacy patch sources; config-only ApkeSU GKI cannot enable it."
                ;;
              *)
                echo "::warning::Unknown ZRAM algorithm requested: $algo"
                ;;
            esac
          done

          if [ "${{ inputs.use_ntsync }}" = "true" ]; then
            append_config "CONFIG_NTSYNC=y"
          fi

          if [ "${{ inputs.use_networking }}" = "true" ]; then
            append_config "CONFIG_NET_SCH_FQ=y"
            append_config "CONFIG_NET_SCH_FQ_CODEL=y"
            append_config "CONFIG_TCP_CONG_BBR=y"
            append_config 'CONFIG_DEFAULT_TCP_CONG="bbr"'
            append_config "CONFIG_IP_SET=y"
            append_config "CONFIG_IP_SET_HASH_IP=y"
            append_config "CONFIG_NETFILTER_XT_SET=y"
          fi

          case "${{ inputs.virtualization_support }}" in
            off|"")
              ;;
            on|123|345|678)
              append_config "CONFIG_VIRTUALIZATION=y"
              append_config "CONFIG_KVM=y"
              append_config "CONFIG_KVM_ARM_VGIC_V3=y"
              echo "::warning::virtualization_support=${{ inputs.virtualization_support }} is applied as config-only support; ABK slot patching is not included."
              ;;
            *)
              echo "::error::Unsupported virtualization_support value: ${{ inputs.virtualization_support }}"
              exit 1
              ;;
          esac

      - name: Setup misc configs
        uses: ./.github/actions/gki-misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Setup OPlus SM8750/MT6991 6.6 GKI profile
        uses: ./.github/actions/gki-oplus-sm8750-6-6
        with:
          version: ${{ inputs.version }}
          variant: ${{ inputs.variant }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          patch_mode: ${{ inputs.oplus_patch_mode }}
          reference_ref: ${{ inputs.oplus_reference_ref }}

      - name: Apply device patches
        uses: ./.github/actions/gki-apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply ApkeSU branding
        uses: ./.github/actions/gki-apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Remove protected exports
        uses: ./.github/actions/gki-remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/gki-clean-kernel-flags

      - name: Scan patch rejects
        id: scan
        if: ${{ always() }}
        uses: ./.github/actions/gki-scan-patch-rejects

      - name: Upload rejects
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name || 'gki' }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Build normal kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/gki-build-kernel
        with:
          version: ${{ inputs.version }}
          bypass: false

      - name: Build bypass kernel
        if: ${{ inputs.build_bypass }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/gki-build-kernel
        with:
          version: ${{ inputs.version }}
          bypass: true

      - name: Create ABK-style AnyKernel3 zip
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ZIP_NAME="${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip"
          rm -f "$ZIP_NAME"
          (cd .gki/AnyKernel3 && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .)
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"

      - name: Create ABK-style bundle
        if: ${{ inputs.upload_aux_artifacts }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          ZIP_NAME="${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip"
          BUNDLE_NAME="$ZIP_NAME.bundle.zip"
          MANIFEST="ABK_BUNDLE_MANIFEST.json"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          payload = Path(os.environ["ZIP_NAME"])
          bundle = Path(os.environ["BUNDLE_NAME"])
          manifest_name = os.environ["MANIFEST"]
          data = payload.read_bytes()
          manifest = {
              "schema": 1,
              "producer": "ApkeSU ABK-style GKI workflow",
              "apkesu_gki_version": os.environ.get("APKESU_GKI_VERSION", "32645"),
              "payload_name": payload.name,
              "payload_sha256": hashlib.sha256(data).hexdigest(),
              "payload_size_bytes": len(data),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with ZipFile(bundle, "w", compression=ZIP_DEFLATED, compresslevel=9) as zf:
              zf.writestr(manifest_name, json.dumps(manifest, sort_keys=True, separators=(",", ":")))
              zf.write(payload, payload.name)
              for doc in ("LICENSE", "THIRD_PARTY_NOTICES.md", "GPL-COMPLIANCE.md"):
                  path = Path(doc)
                  if path.is_file():
                      zf.write(path, doc)
          PY
        env:
          ZIP_NAME: ${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip
          BUNDLE_NAME: ${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip.bundle.zip
          MANIFEST: ABK_BUNDLE_MANIFEST.json

      - name: Create ApkeSU GKI info
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          info = {
              "schema": 1,
              "producer": "ApkeSU ABK-style GKI workflow",
              "project": "ApkeSU",
              "artifact": "GKI",
              "apkesu_gki_version": os.environ.get("APKESU_GKI_VERSION", "32645"),
              "ksu_version_override": os.environ.get("KSU_VERSION_OVERRIDE", "32645"),
              "feature_set": os.environ.get("FEATURE_SET", ""),
              "version": os.environ.get("GKI_VERSION", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with open("APKESU_GKI_INFO.json", "w", encoding="utf-8") as fp:
              json.dump(info, fp, sort_keys=True, separators=(",", ":"))
              fp.write("\n")
          PY
        env:
          FEATURE_SET: ${{ inputs.feature_set }}
          GKI_VERSION: ${{ inputs.version }}

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3
          path: |
            ${{ github.workspace }}/${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip
            ${{ github.workspace }}/${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip.sha256
            ${{ github.workspace }}/${{ steps.extract.outputs.file_name }}-${{ inputs.feature_set }}-AnyKernel3.zip.bundle.zip
            ${{ github.workspace }}/APKESU_GKI_INFO.json
          if-no-files-found: error
          compression-level: 9

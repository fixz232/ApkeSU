name: Build Custom ABK Style ApkeSU GKI

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android version"
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android15
      kernel_version:
        description: "Kernel version"
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "6.6"
      sublevel:
        description: "Kernel sublevel, or X for lts"
        type: string
        default: "89"
      os_patch_level:
        description: "Patch level: YYYY-MM, lts, or latest"
        type: string
        default: "2025-06"
      feature_set:
        description: "Feature set"
        type: choice
        options:
          - ApkeSU
          - ApkeSU+SUSFS
        default: ApkeSU+SUSFS
      use_repo:
        description: "Use repo sync instead of archive downloader"
        type: boolean
        default: true
      use_latest_susfs:
        description: "Use SUSFS branch tip instead of pinned commit"
        type: boolean
        default: true
      build_bypass:
        description: "Also build Bypass-Image"
        type: boolean
        default: false
      build_time:
        description: "Build timestamp, N/empty for current UTC"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        description: "Enable ABK-style ZRAM config bundle"
        type: boolean
        default: false
      zram_full_algo:
        description: "Enable extra ZRAM crypto algorithms"
        type: boolean
        default: false
      zram_extra_algos:
        description: "Comma-separated ZRAM algorithms"
        type: string
        default: ""
      use_ntsync:
        description: "Enable CONFIG_NTSYNC"
        type: boolean
        default: false
      use_networking:
        description: "Enable BBR/IPSet networking configs"
        type: boolean
        default: false
      virtualization_support:
        description: "Virtualization support"
        type: choice
        options:
          - "off"
          - "on"
          - "678"
          - "123"
          - "345"
        default: "off"
      use_bbg:
        description: "ABK BBG switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      use_ddk:
        description: "ABK DDK switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      use_kpm:
        description: "ABK KPM switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      use_rekernel:
        description: "ABK Re-Kernel switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      upload_aux_artifacts:
        description: "Upload ABK-style bundle zip"
        type: boolean
        default: true
      oplus_patch_mode:
        description: "OPlus 6.6 reference patches"
        type: choice
        options:
          - off
          - compat
          - zram
        default: "off"
      oplus_reference_ref:
        description: "cctv18/oppo_oplus_realme_sm8750 ref"
        type: string
        default: "main"

jobs:
  resolve-target:
    name: Resolve custom GKI target
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      android_version: ${{ steps.resolve.outputs.android_version }}
      kernel_version: ${{ steps.resolve.outputs.kernel_version }}
      sublevel: ${{ steps.resolve.outputs.sublevel }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
      variant: ${{ steps.resolve.outputs.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate target against GKI config
        id: resolve
        shell: bash
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          SUBLEVEL: ${{ inputs.sublevel }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const androidVersion = process.env.ANDROID_VERSION.trim();
          const kernelVersion = process.env.KERNEL_VERSION.trim();
          const requestedSublevelRaw = process.env.SUBLEVEL.trim();
          const requestedPatchRaw = process.env.OS_PATCH_LEVEL.trim();
          const requestedSublevel = requestedSublevelRaw.toLowerCase() === "x" ? "X" : requestedSublevelRaw;
          const requestedPatch = requestedPatchRaw.toLowerCase();
          const version = `${androidVersion}-${kernelVersion}`;
          const configFile = path.join(".github", "config", `gki-${version}.json`);

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function writeOutput(name, value) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }

          if (!fs.existsSync(configFile)) {
            const supported = fs.readdirSync(path.join(".github", "config"))
              .filter((file) => /^gki-android.*\.json$/.test(file))
              .map((file) => file.replace(/^gki-/, "").replace(/\.json$/, ""))
              .sort()
              .join(", ");
            fail(`Unsupported GKI target ${version}. Supported targets: ${supported}`);
          }

          const cfg = JSON.parse(fs.readFileSync(configFile, "utf8"));
          if (cfg.version !== version) {
            fail(`${configFile} declares ${cfg.version}, expected ${version}`);
          }

          let entry;
          if (requestedPatch === "latest") {
            entry = [...cfg.include].filter((item) => item.date !== "lts").at(-1);
            if (!entry) {
              fail(`${version} has no non-lts entries in ${configFile}`);
            }
            console.log(`Resolved latest ${version} to ${entry.sublevel}/${entry.date}`);
          } else {
            entry = cfg.include.find((item) =>
              String(item.sublevel) === requestedSublevel && item.date === requestedPatch
            );
          }

          if (!entry) {
            const pairs = cfg.include
              .map((item) => `${item.sublevel}/${item.date}`)
              .join(", ");
            fail(`Unsupported ${version} sublevel/patch pair ${requestedSublevel}/${requestedPatch}. Available pairs: ${pairs}`);
          }

          const variant = entry.variant || cfg.variant || "Normal";
          writeOutput("version", version);
          writeOutput("android_version", androidVersion);
          writeOutput("kernel_version", kernelVersion);
          writeOutput("sublevel", entry.sublevel);
          writeOutput("os_patch_level", entry.date);
          writeOutput("variant", variant);

          const summary = [
            "### Custom ABK-style ApkeSU GKI target",
            "",
            `- Config: \`${configFile}\``,
            `- Version: \`${version}\``,
            `- Sublevel: \`${entry.sublevel}\``,
            `- Patch level: \`${entry.date}\``,
            `- Variant: \`${variant}\``,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE

  build:
    name: Build ${{ needs.resolve-target.outputs.kernel_version }}.${{ needs.resolve-target.outputs.sublevel }}-${{ needs.resolve-target.outputs.android_version }}-${{ needs.resolve-target.outputs.os_patch_level }}
    needs: resolve-target
    uses: ./.github/workflows/gki-abk-build.yml
    with:
      version: ${{ needs.resolve-target.outputs.version }}
      android_version: ${{ needs.resolve-target.outputs.android_version }}
      kernel_version: ${{ needs.resolve-target.outputs.kernel_version }}
      sublevel: ${{ needs.resolve-target.outputs.sublevel }}
      os_patch_level: ${{ needs.resolve-target.outputs.os_patch_level }}
      variant: ${{ needs.resolve-target.outputs.variant }}
      feature_set: ${{ inputs.feature_set }}
      use_repo: ${{ inputs.use_repo }}
      use_latest_susfs: ${{ inputs.use_latest_susfs }}
      build_bypass: ${{ inputs.build_bypass }}
      build_time: ${{ inputs.build_time }}
      use_zram: ${{ inputs.use_zram }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      virtualization_support: ${{ inputs.virtualization_support }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      upload_aux_artifacts: ${{ inputs.upload_aux_artifacts }}
      oplus_patch_mode: ${{ inputs.oplus_patch_mode }}
      oplus_reference_ref: ${{ inputs.oplus_reference_ref }}
    secrets: inherit

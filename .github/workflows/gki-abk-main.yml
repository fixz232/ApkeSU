name: Build ABK Style ApkeSU GKI

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_build_version:
        description: "Kernel version"
        type: choice
        options:
          - All
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
        default: android15-6.6
      feature_set:
        description: "Feature set"
        type: choice
        options:
          - ApkeSU
          - ApkeSU+SUSFS
        default: ApkeSU+SUSFS
      os_patch_level:
        description: "Patch level: latest, all, or YYYY-MM"
        type: string
        default: latest
      use_repo:
        description: "Use repo sync instead of archive downloader"
        type: boolean
        default: true
      use_latest_susfs:
        description: "Use SUSFS branch tip instead of pinned commit"
        type: boolean
        default: true
      build_bypass:
        description: "Also build Bypass-Image"
        type: boolean
        default: false
      build_time:
        description: "Build timestamp, N/empty for current UTC"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        description: "Enable ABK-style ZRAM config bundle"
        type: boolean
        default: false
      zram_full_algo:
        description: "Enable extra ZRAM crypto algorithms"
        type: boolean
        default: false
      zram_extra_algos:
        description: "Comma-separated ZRAM algorithms"
        type: string
        default: ""
      use_ntsync:
        description: "Enable CONFIG_NTSYNC"
        type: boolean
        default: false
      use_networking:
        description: "Enable BBR/IPSet networking configs"
        type: boolean
        default: false
      virtualization_support:
        description: "Virtualization support"
        type: choice
        options:
          - "off"
          - "on"
          - "678"
          - "123"
          - "345"
        default: "off"
      use_bbg:
        description: "ABK BBG switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      use_ddk:
        description: "ABK DDK switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      use_kpm:
        description: "ABK KPM switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      use_rekernel:
        description: "ABK Re-Kernel switch (fails until ApkeSU implementation exists)"
        type: boolean
        default: false
      upload_aux_artifacts:
        description: "Upload ABK-style bundle zip"
        type: boolean
        default: true
      oplus_patch_mode:
        description: "OPlus 6.6 reference patches"
        type: choice
        options:
          - off
          - compat
          - zram
        default: "off"
      oplus_reference_ref:
        description: "cctv18/oppo_oplus_realme_sm8750 ref"
        type: string
        default: "main"

jobs:
  build-android12-5-10:
    if: ${{ inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android12-5.10' }}
    uses: ./.github/workflows/gki-abk-prepare.yml
    with:
      config_file: .github/config/gki-android12-5.10.json
      feature_set: ${{ inputs.feature_set }}
      os_patch_level: ${{ inputs.os_patch_level }}
      use_repo: ${{ inputs.use_repo }}
      use_latest_susfs: ${{ inputs.use_latest_susfs }}
      build_bypass: ${{ inputs.build_bypass }}
      build_time: ${{ inputs.build_time }}
      use_zram: ${{ inputs.use_zram }}
      zram_full_algo: ${{ inputs.zram_full_algo }}
      zram_extra_algos: ${{ inputs.zram_extra_algos }}
      use_ntsync: ${{ inputs.use_ntsync }}
      use_networking: ${{ inputs.use_networking }}
      virtualization_support: ${{ inputs.virtualization_support }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      upload_aux_artifacts: ${{ inputs.upload_aux_artifacts }}
      oplus_patch_mode: ${{ inputs.oplus_patch_mode }}
      oplus_reference_ref: ${{ inputs.oplus_reference_ref }}
    secrets: inherit

  build-android13-5-10:
    if: ${{ inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android13-5.10' }}

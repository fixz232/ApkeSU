name: Moderate cloud theme creators and submissions

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: theme-store-catalog-write
  cancel-in-progress: false

jobs:
  setup-labels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Create moderation labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create theme-store --repo "$GITHUB_REPOSITORY" --color 6f42c1 --description "ApkeSU cloud theme store" --force
          gh label create theme-creator-application --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "Cloud theme creator application" --force
          gh label create creator-approved --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Approval by fixz232" --force
          gh label create creator-active --repo "$GITHUB_REPOSITORY" --color 2ea44f --description "Approved cloud theme creator" --force
          gh label create creator-rejected --repo "$GITHUB_REPOSITORY" --color b60205 --description "Creator application rejected" --force
          gh label create creator-needs-changes --repo "$GITHUB_REPOSITORY" --color fbca04 --description "Creator application needs changes" --force
          gh label create theme-submission --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "Cloud theme submission" --force
          gh label create theme-approved --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Publication approval by fixz232" --force
          gh label create theme-published --repo "$GITHUB_REPOSITORY" --color 2ea44f --description "Published in the cloud theme catalog" --force
          gh label create theme-rejected --repo "$GITHUB_REPOSITORY" --color b60205 --description "Cloud theme submission rejected" --force
          gh label create theme-needs-changes --repo "$GITHUB_REPOSITORY" --color fbca04 --description "Cloud theme submission needs changes" --force

  approve-creator:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'creator-approved' &&
      github.actor == 'fixz232'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ApkeSU
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify and approve creator
        id: verify_creator
        run: |
          python theme-store/scripts/approve_creator.py \
            --registry theme-store/creators/v1/creators.json \
            --event "$GITHUB_EVENT_PATH" \
            --reviewer "$GITHUB_ACTOR"
          cp theme-store/creators/v1/creators.json \
            manager/app/src/main/assets/theme-store/creators-v1.json

      - name: Commit creator registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-store/creators/v1/creators.json \
            manager/app/src/main/assets/theme-store/creators-v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "theme-store: Approve creator ${{ github.event.issue.user.login }}"
          git pull --rebase origin ApkeSU
          git push origin HEAD:ApkeSU

      - name: Mark application approved
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create creator-active --repo "$GITHUB_REPOSITORY" --color 2ea44f --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label creator-active
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Creator approved by @fixz232. Refresh Creator Center in the Manager to unlock submissions."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Request creator application changes
        if: failure() && steps.verify_creator.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create creator-needs-changes --repo "$GITHUB_REPOSITORY" --color fbca04 --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label creator-needs-changes
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Automated creator verification failed. Review the workflow log and correct the application before asking @fixz232 to review it again."

  publish-theme:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'theme-approved' &&
      github.actor == 'fixz232'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ApkeSU
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify creator, manifest, package, and media
        id: verify_submission
        run: |
          python theme-store/scripts/process_submission.py \
            --registry theme-store/creators/v1/creators.json \
            --catalog theme-store/catalog/v1/catalog.json \
            --event "$GITHUB_EVENT_PATH" \
            --reviewer "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir /tmp/apkesu-theme-release \
            --result /tmp/apkesu-theme-result.json

      - name: Create canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(python -c 'import json; print(json.load(open("/tmp/apkesu-theme-result.json"))["tag"])')"
          ASSET="$(python -c 'import json; print(json.load(open("/tmp/apkesu-theme-result.json"))["packagePath"])')"
          THEME_ID="$(python -c 'import json; print(json.load(open("/tmp/apkesu-theme-result.json"))["themeId"])')"
          VERSION_CODE="$(python -c 'import json; print(json.load(open("/tmp/apkesu-theme-result.json"))["versionCode"])')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title "Cloud theme ${THEME_ID} v${VERSION_CODE}" \
              --notes "Reviewed by fixz232 and verified by the ApkeSU theme-store workflow."
          fi

      - name: Commit catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-store/catalog/v1/catalog.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "theme-store: Publish ${{ github.event.issue.title }}"
          git pull --rebase origin ApkeSU
          git push origin HEAD:ApkeSU

      - name: Mark submission published
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create theme-published --repo "$GITHUB_REPOSITORY" --color 2ea44f --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label theme-published
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Theme approved by @fixz232, revalidated, and published to the cloud catalog."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Mark failed submission for changes
        if: failure() && steps.verify_submission.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create theme-needs-changes --repo "$GITHUB_REPOSITORY" --color fbca04 --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label theme-needs-changes
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Automated verification failed. Review the workflow log, correct the package or manifest, then ask @fixz232 to review again."

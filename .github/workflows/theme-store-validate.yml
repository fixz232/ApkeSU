name: Validate cloud theme catalog

on:
  pull_request:
    paths:
      - "theme-store/**"
      - ".github/ISSUE_TEMPLATE/cloud_theme_*.yml"
      - ".github/workflows/theme-store-moderation.yml"
      - ".github/workflows/theme-store-validate.yml"
  push:
    branches: [ApkeSU]
    paths:
      - "theme-store/**"
      - ".github/ISSUE_TEMPLATE/cloud_theme_*.yml"
      - ".github/workflows/theme-store-moderation.yml"
      - ".github/workflows/theme-store-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Read previous catalog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git show "$BASE_SHA:theme-store/catalog/v1/catalog.json" > /tmp/previous-catalog.json || true
          else
            git show HEAD^:theme-store/catalog/v1/catalog.json > /tmp/previous-catalog.json || true
          fi

      - name: Validate schema, versions, packages, and media
        run: |
          EXTRA=()
          if [ -s /tmp/previous-catalog.json ]; then
            EXTRA+=(--previous /tmp/previous-catalog.json)
          fi
          python theme-store/scripts/validate_catalog.py \
            theme-store/catalog/v1/catalog.json \
            --schema theme-store/schemas/catalog-v1.schema.json \
            --check-remote \
            "${EXTRA[@]}"

      - name: Validate creator registry
        run: |
          python - <<'PY'
          import json
          import jsonschema
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("theme-store/scripts").resolve()))
          from moderation_common import validate_registry

          registry = json.loads(Path("theme-store/creators/v1/creators.json").read_text(encoding="utf-8"))
          bundled = json.loads(Path("manager/app/src/main/assets/theme-store/creators-v1.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("theme-store/schemas/creator-registry-v1.schema.json").read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator(schema).validate(registry)
          validate_registry(registry)
          if registry != bundled:
              raise SystemExit("bundled creator registry is out of sync")
          PY

      - name: Run theme store moderation tests
        run: python -m unittest discover -s theme-store/tests -p "test_*.py" -v

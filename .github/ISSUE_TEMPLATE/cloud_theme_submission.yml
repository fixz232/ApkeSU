name: Cloud theme submission
description: Approved creators can submit a new or updated .kstheme package for review
title: "[Cloud theme] "
labels: ["theme-store", "theme-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Only accounts in the approved creator registry may submit. The package, images, metadata, author identity, hash, and size are verified again by GitHub Actions after **fixz232** approves this issue.
  - type: input
    id: theme_id
    attributes:
      label: Theme ID
      description: Stable lowercase ID using letters, digits, dots, underscores, or hyphens.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: Existing category ID or a new `id | display name` pair.
    validations:
      required: true
  - type: input
    id: package_url
    attributes:
      label: GitHub-hosted package URL
      description: Public HTTPS URL ending in .kstheme.
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Submission manifest
      description: JSON generated by the ApkeSU Creator Center. Do not remove the schema, author, hash, size, compatibility, license, or media fields.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: I have the right to redistribute every included asset under the declared license.
          required: true
        - label: I removed private identity fields, credentials, and device-specific data.
          required: true
        - label: The GitHub Release package URL is public and its bytes exactly match the locally verified package.
          required: true
        - label: I tested import, apply, and rollback with a supported ApkeSU Manager version.
          required: true
